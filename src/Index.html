<!DOCTYPE html>
<html lang="en">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700;6..12,800&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#1F1A3D; --ink-2:#4A4466; --muted:#7D7896; --line:#E6E1F5;
  --paper:#F5F3FF; --card:#FFFFFF;
  --grape:#6D4AFF; --gum:#FF5C8A; --sun:#FFC23D; --pool:#14A9C4; --grass:#2FA86A; --red:#E5484D; --amber:#F08C00;
  --display:'Fredoka','Trebuchet MS',system-ui,sans-serif;
  --body:'Nunito Sans','Segoe UI',system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:var(--body);font-size:15px;line-height:1.45;color:var(--ink);background:var(--paper);-webkit-font-smoothing:antialiased}
body::after{content:"";position:fixed;inset:0;z-index:-1;background:linear-gradient(180deg,rgba(245,243,255,.62) 0%,rgba(245,243,255,.74) 45%,rgba(245,243,255,.86) 100%)}
h1,h2,h3{font-family:var(--display);font-weight:600;margin:0;line-height:1.15;letter-spacing:.1px}
h2{font-size:24px} h3{font-size:18px}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.muted{color:var(--muted)} .small{font-size:13px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.row.end{justify-content:flex-end;margin-top:16px}
.spacer{flex:1}
.num{font-variant-numeric:tabular-nums}

/* ---------- top bar ---------- */
.top{position:sticky;top:0;z-index:30;background:var(--ink);color:#fff;padding:10px 20px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px}
.logo-pill{background:#fff;border-radius:12px;padding:4px 10px;height:50px;display:flex;align-items:center;flex:none}
.logo-pill img{height:42px;width:auto;display:block}
@media (max-width:600px){.logo-pill{height:42px;padding:3px 8px}.logo-pill img{height:34px}}
.brand h1{font-size:21px}
.brand small{display:block;color:#C9C3E6;font-size:12.5px;font-weight:600}
.clock{font-family:var(--display);font-size:19px;color:var(--sun);white-space:nowrap}
.staff{display:flex;align-items:center;gap:8px;font-size:13px;color:#C9C3E6;white-space:nowrap}
.staff select{background:#2E2853;border:1px solid #463F70;color:#fff;border-radius:10px;padding:7px 10px;min-width:170px}
.staff.need select{border-color:var(--gum);box-shadow:0 0 0 3px rgba(255,92,138,.35)}
.loadinfo{display:flex;flex-direction:column;align-items:flex-end;line-height:1.25;font-size:12.5px;font-weight:700;color:#C9C3E6;white-space:nowrap}
.loadinfo b{color:#fff;font-family:var(--display);font-weight:600;font-size:14px}
.loadinfo .li-main{display:flex;align-items:center;gap:6px}
.loadinfo .bad{color:#FF9AA2}
.top .spin{border-color:#463F70;border-top-color:var(--sun)}
.spin.xs{width:12px;height:12px;border-width:2px;vertical-align:baseline}
.hbtn .ric{display:inline-block}
.hbtn.spinning .ric{animation:rot .8s linear infinite}

nav.tabs{max-width:1240px;margin:0 auto;padding:14px 20px 0;display:flex;gap:6px;flex-wrap:wrap}
.tab{border:0;background:rgba(255,255,255,.72);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);padding:10px 16px;border-radius:12px;font-weight:800;color:var(--ink-2);cursor:pointer;display:flex;align-items:center;gap:8px}
.tab:hover{background:#ECE8FF}
.tab.active{background:var(--card);color:var(--ink);box-shadow:0 2px 0 var(--line)}

main{max-width:1240px;margin:0 auto;padding:14px 20px 130px}
.view{display:none}.view.active{display:block}

/* ---------- surfaces ---------- */
.card{background:var(--card);border-radius:20px;padding:20px;margin-bottom:16px;border:1px solid var(--line);box-shadow:0 6px 22px rgba(31,26,61,.10)}
.sec-head{display:flex;align-items:center;gap:10px;justify-content:space-between;margin-bottom:6px;flex-wrap:wrap}
.banner{margin-bottom:10px;padding:10px 14px;border-radius:12px;font-weight:800;background:#FFF4DB;color:#7A4B00}
.banner.err{background:#FDECEC;color:#9B1C1C}

/* ---------- hero: section + search ---------- */
.hero{padding:22px 24px}
.hero h2{font-size:20px;color:var(--ink-2);font-weight:500}
.seg{display:inline-flex;border:1.5px solid var(--line);border-radius:14px;overflow:hidden;margin-top:10px}
.seg button{border:0;background:#fff;padding:12px 30px;font-weight:800;font-size:16px;cursor:pointer;font-family:var(--display)}
.seg button.on{background:var(--grape);color:#fff}
.seg.sm{margin-top:0}
.seg.sm button{padding:9px 16px;font-size:14px}
.search-row{display:flex;gap:10px;align-items:stretch;margin-top:14px;flex-wrap:wrap}
.search-box{flex:1;min-width:240px;display:flex;align-items:center;background:var(--paper);border:2px solid var(--line);border-radius:16px;padding:0 16px;transition:border-color .15s}
.search-box:focus-within{border-color:var(--grape)}
.search-box .ico{font-size:22px;margin-right:10px}
.search-box input{flex:1;border:0;background:transparent;font-family:var(--display);font-size:26px;font-weight:600;padding:10px 0;min-width:0;outline:none}
.search-box input::placeholder{color:#C8C2E0}
.meta{margin-top:10px;min-height:22px;font-weight:700;color:var(--ink-2)}

/* ---------- buttons ---------- */
.btn{border:0;border-radius:12px;padding:10px 16px;font-weight:800;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;transition:transform .05s,filter .15s}
.btn:active{transform:translateY(1px)}
.btn:disabled{opacity:.55;cursor:not-allowed}
.btn.primary{background:var(--grape);color:#fff}
.btn.primary:hover{filter:brightness(1.08)}
.btn.go{background:var(--grass);color:#fff}
.btn.sunny{background:var(--sun);color:var(--ink)}
.btn.soft{background:#EEEAFF;color:var(--grape)}
.btn.ghost{background:transparent;color:var(--ink-2);border:1.5px solid var(--line)}
.btn.danger{background:#FDECEC;color:var(--red)}
.btn.big{padding:14px 22px;font-size:16.5px;border-radius:14px}
.btn.sm{padding:6px 12px;font-size:13px;border-radius:10px}

/* ---------- forms ---------- */
label{display:flex;flex-direction:column;gap:5px;font-weight:700;font-size:13px;color:var(--ink-2)}
input,select,textarea{border:1.5px solid var(--line);border-radius:11px;padding:10px 12px;background:#fff;font-size:15px;font-weight:600;color:var(--ink);width:100%}
input:focus,select:focus,textarea:focus{border-color:var(--grape);outline:none}
.fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px;margin-top:12px}
.fgrid .full{grid-column:1/-1}
.stepper{display:flex;border:1.5px solid var(--line);border-radius:11px;overflow:hidden;max-width:220px}
.stepper input{border:0;border-radius:0;text-align:center;padding:9px 4px;font-family:var(--display);font-size:22px}
.stepper button{border:0;background:var(--paper);width:48px;font-size:22px;font-weight:800;cursor:pointer;color:var(--grape)}
.check{flex-direction:row;align-items:center;gap:10px;font-size:14px;cursor:pointer}
.check input{width:20px;height:20px;margin:0;accent-color:var(--grape)}

/* ---------- pills & chips ---------- */
.pill{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:999px;font-size:12.5px;font-weight:800;background:var(--paper);color:var(--ink-2);white-space:nowrap}
.pill.warn{background:#FFF1D6;color:#8A5300}
.pill.bad{background:#FDECEC;color:var(--red)}
.pill.ok{background:#E5F6EC;color:#1D6B43}
.pill.pend{background:#EEEAFF;color:var(--grape)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.chip{--c:var(--grape);border:0;cursor:pointer;display:inline-flex;align-items:center;gap:8px;padding:6px 6px 6px 12px;border-radius:999px;background:color-mix(in srgb,var(--c) 12%,#fff);color:color-mix(in srgb,var(--c) 75%,#000);font-weight:800;font-size:13px}
.chip b{background:var(--c);color:#fff;border-radius:999px;padding:1px 9px}
.chip.on{background:var(--c);color:#fff}
.chip.on b{background:#fff;color:var(--c)}
.tag{--c:var(--grape);font-size:12px;font-weight:800;padding:3px 9px;border-radius:8px;background:color-mix(in srgb,var(--c) 14%,#fff);color:color-mix(in srgb,var(--c) 75%,#000);white-space:nowrap}

/* ---------- item cards ---------- */
.item-wrap{border:2px solid var(--line);border-radius:16px;margin-top:10px;overflow:hidden;transition:border-color .15s;background:#fff}
.item-wrap.on{border-color:var(--grape)}
.item-wrap.out{background:#FFF7F7}
.item{display:flex;align-items:center;gap:14px;padding:12px 14px;cursor:pointer;user-select:none}
.item:hover{background:#FAF9FF}
.item-name{font-family:var(--display);font-size:19px;font-weight:600;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.item-meta{display:flex;gap:12px;flex-wrap:wrap;color:var(--muted);font-size:13px;font-weight:700;margin-top:2px}
.item-meta .p{color:var(--grass)} .item-meta .m{color:var(--red)}
.stock{margin-left:auto;text-align:right;min-width:70px}
.stock b{display:block;font-family:var(--display);font-size:32px;line-height:1}
.stock span{font-size:12px;color:var(--muted);font-weight:700}
.item-wrap.out .stock b{color:var(--red)}
.item-opts{padding:6px 14px 16px;background:#FAF9FF;border-top:1px solid var(--line)}
.types{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.type{--c:var(--grape);border:2px solid color-mix(in srgb,var(--c) 35%,#fff);background:#fff;border-radius:12px;padding:8px 14px;cursor:pointer;text-align:left;font-weight:800;display:flex;flex-direction:column;line-height:1.15}
.type small{font-weight:700;color:var(--muted);font-size:11.5px}
.type.on{background:var(--c);border-color:var(--c);color:#fff}
.type.on small{color:rgba(255,255,255,.85)}
.opt-grid{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:end;margin-top:12px}
@media (max-width:560px){.opt-grid{grid-template-columns:1fr}}
.preview{margin-top:10px;font-weight:800;font-size:14px;color:var(--grape)}
.preview.bad{color:var(--red)}
.empty{padding:22px;text-align:center;color:var(--muted);font-weight:700}

/* ---------- sticky save bar ---------- */
.ci-bar{position:fixed;left:0;right:0;bottom:0;z-index:25;background:#fff;border-top:1px solid var(--line);padding:12px 20px;display:none;box-shadow:0 -8px 24px rgba(31,26,61,.08)}
.ci-bar.show{display:block}
.ci-inner{max-width:1240px;margin:0 auto;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.ci-sum{flex:1;font-weight:800;min-width:200px}
.ci-sum small{display:block;color:var(--muted);font-weight:700}

/* ---------- review lines ---------- */
.line{display:flex;gap:12px;align-items:flex-start;border-top:1px solid var(--line);padding:10px 0}
.line:first-of-type{border-top:0}
.line .t1{font-family:var(--display);font-size:17px;font-weight:600}
.line .t2{font-size:13px;color:var(--ink-2);font-weight:700;margin-top:2px}
.line .rm{margin-left:auto}
.err{color:var(--red);font-weight:800;font-size:14px;margin-top:8px;min-height:18px}

/* ---------- summary ---------- */
.toolbar{display:flex;gap:12px;align-items:flex-end;flex-wrap:wrap}
.toolbar label{max-width:190px}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px 16px;box-shadow:0 6px 22px rgba(31,26,61,.10)}
.kpi b{display:block;font-family:var(--display);font-size:32px;line-height:1.1}
.kpi span{font-size:13px;color:var(--muted);font-weight:700}
.bars .bar{display:grid;grid-template-columns:150px 1fr 44px;gap:10px;align-items:center;margin-top:10px;font-weight:700;font-size:13.5px}
.bars .track{height:12px;border-radius:6px;background:var(--paper);overflow:hidden}
.bars .fill{height:100%;border-radius:6px;background:var(--red)}
.two{display:grid;grid-template-columns:1fr 1.4fr;gap:16px;align-items:start}
@media (max-width:920px){.two{grid-template-columns:1fr}}
.band-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px;margin-top:8px}
.band-card{border:2px solid #F3B6B6;border-radius:16px;padding:12px;background:#FFF5F5}
.band-card .bc-top{font-family:var(--display);font-weight:600;font-size:16px}
.band-card .bc-top small{display:block;font-family:var(--body);color:var(--muted);font-weight:800;font-size:12px}
.band-card .bc-num{display:flex;align-items:baseline;gap:6px;margin:6px 0 4px}
.band-card .bc-num b{font-family:var(--display);font-size:34px;line-height:1;color:var(--red)}
.band-card .bc-num span{color:var(--muted);font-weight:800;font-size:13px}
.band-card .bc-bar{height:8px;background:#F7DADA;border-radius:99px;overflow:hidden}
.band-card .bc-bar i{display:block;height:100%;background:var(--red)}
.tbl{width:100%;border-collapse:collapse;font-size:13.5px}
.tbl th{text-align:left;color:var(--muted);font-weight:800;font-size:12px;padding:8px;border-bottom:1.5px solid var(--line);white-space:nowrap}
.tbl td{padding:9px 8px;border-bottom:1px solid #F1EEFA;font-weight:600}
.tbl td.n,.tbl th.n{text-align:right;font-variant-numeric:tabular-nums}
.tbl td.b{color:var(--red);font-weight:800} .tbl td.a{color:var(--grass);font-weight:800}
.tbl tr.void td{opacity:.5;text-decoration:line-through}
.tbl tr.total td{font-weight:800;border-top:1.5px solid var(--line)}
.tbl-wrap{overflow-x:auto}

/* ---------- modal ---------- */
.modal{position:fixed;inset:0;z-index:50;background:rgba(31,26,61,.55);display:none;align-items:center;justify-content:center;padding:16px}
.modal.open{display:flex}
.modal-box{background:#fff;border-radius:22px;padding:24px;width:min(640px,100%);max-height:92vh;overflow:auto}
.modal.open .modal-box{animation:pop .22s ease-out}
@keyframes pop{from{transform:scale(.96);opacity:0}to{transform:none;opacity:1}}

/* ---------- toast / loading ---------- */
.toasts{position:fixed;right:18px;bottom:96px;z-index:60;display:flex;flex-direction:column;gap:8px;align-items:flex-end}
.toast{background:var(--ink);color:#fff;padding:12px 16px;border-radius:12px;font-weight:700;max-width:380px;box-shadow:0 8px 24px rgba(31,26,61,.25)}
.toast.err{background:var(--red)} .toast.ok{background:var(--grass)}
.spin{display:inline-block;width:16px;height:16px;border:2.5px solid var(--line);border-top-color:var(--grape);border-radius:50%;animation:rot .7s linear infinite;vertical-align:-3px}
@keyframes rot{to{transform:rotate(360deg)}}
.sk{background:linear-gradient(90deg,#EEEAFB 25%,#F7F5FE 50%,#EEEAFB 75%);background-size:200% 100%;animation:sh 1.1s infinite;border-radius:12px}
@keyframes sh{to{background-position:-200% 0}}
.boot{display:grid;place-items:center;min-height:60vh;text-align:center;color:var(--muted);font-weight:700}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

  <div class="loadinfo" id="loadInfo" aria-live="polite">
    <span class="li-main"><i class="spin xs" id="liSpin" style="display:none"></i><span id="liLab">Starting…</span><b id="liVal"></b></span>
    <span id="liSub"></span>
  </div>
  <button class="btn sunny sm hbtn" id="btnHdrRefresh" title="Reload everything: staff list, stock and summary"><span class="ric">⟳</span> Refresh</button>
  <div class="clock num" id="clock"></div>
  <div class="staff" id="staffWrap"><span>Entry by</span>
    <select id="staffSel" aria-label="Who is making the entries"><option value="">Select</option></select>
  </div>
</header>

<nav class="tabs" role="tablist">
  <button class="tab active" data-view="stock">🍽️ Stock &amp; entry</button>
  <button class="tab" data-view="sum">📊 Summary</button>
  <button class="tab" data-view="ent">🧾 Entries</button>
</nav>

<main>
  <div id="bootBox" class="boot"><div><span class="spin"></span><p>Loading the app…</p></div></div>
  <div id="banners"></div>

  <!-- STOCK & ENTRY -->
  <section id="v-stock" class="view">
    <div class="card hero">
      <h2>Which section is this entry for?</h2>
      <div class="seg" id="secSeg">
        <button type="button" data-sec="Cafe" class="on">☕ Cafe</button>
        <button type="button" data-sec="Barista">🧋 Barista</button>
      </div>
      <div class="search-row">
        <div class="search-box"><span class="ico">🔍</span><input id="q" type="search" autocomplete="off" placeholder="Search items…" aria-label="Search items"></div>
      </div>
      <div class="meta num" id="stockMeta"></div>
      <div class="chips" id="chips"></div>
    </div>
    <div id="stockList"></div>
  </section>

  <!-- SUMMARY -->
  <section id="v-sum" class="view">
    <div class="card"><div class="toolbar" id="sumFilters"></div></div>
    <div id="sumOut"></div>
  </section>

  <!-- ENTRIES -->
  <section id="v-ent" class="view">
    <div class="card"><div class="toolbar" id="entFilters"></div></div>
    <div id="entOut"></div>
  </section>
</main>

<div class="ci-bar" id="ciBar">
  <div class="ci-inner">
    <div class="ci-sum" id="ciSum"></div>
    <button class="btn ghost" id="ciClear">Clear</button>
    <button class="btn go big" id="ciBtn">Review &amp; save</button>
  </div>
</div>

<div class="modal" id="modal"><div class="modal-box" id="modalBody"></div></div>
<div class="toasts" id="toasts"></div>

<script>
/* ================= STATE & UTILS ================= */
const TYPES = {
  ADD:      { label: 'Add',      hint: 'New stock received',   sign: +1, c: 'var(--grass)' },
  BREAKAGE: { label: 'Breakage', hint: 'Broken or chipped',    sign: -1, c: 'var(--red)' },
  MISSING:  { label: 'Missing',  hint: 'Lost or not found',    sign: -1, c: 'var(--amber)' }
};
const S = { init: null, section: 'Cafe', stock: null, cart: [], reqId: null, cat: 'All', q: '', open: null, ed: null,
            view: 'stock', busy: false, staff: '', sum: null, f: null, onlyMoved: false, sumQ: '', entQ: '', modalLock: false,
            pending: 0, refreshing: false, load: { start: 0, ms: null, at: null, failed: false } };
const $ = (s, el) => (el || document).querySelector(s);
const $$ = (s, el) => Array.from((el || document).querySelectorAll(s));

function esc(v){ return String(v == null ? '' : v).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
function call(fn, ...args){
  return new Promise((res, rej) => {
    google.script.run.withSuccessHandler(res)
      .withFailureHandler(e => rej(new Error((e && e.message) ? e.message : String(e))))[fn](...args);
  });
}
function errMsg(e){ return String((e && e.message) || e || 'Something went wrong').replace(/^(Error|Exception|ScriptError):\s*/i, ''); }
function uuid(){
  if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
  return 'r' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 12) + '-' + Math.random().toString(36).slice(2, 12);
}
function store(k, v){ try { if (v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); } catch (e) { return null; } }
function fmtDate(ymd){
  if (!ymd) return '';
  const m = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  const p = ymd.split('-'); return Number(p[2]) + ' ' + m[Number(p[1]) - 1] + ' ' + p[0];
}
function sgn(n){ return n > 0 ? '+' + n : String(n); }
function toast(msg, type){
  const t = document.createElement('div'); t.className = 'toast ' + (type || ''); t.textContent = msg;
  $('#toasts').appendChild(t); setTimeout(() => t.remove(), type === 'err' ? 5000 : 3000);
}
function modal(html){ $('#modalBody').innerHTML = html; $('#modal').classList.add('open'); setTimeout(() => { const f = $('#modalBody [autofocus]'); if (f) f.focus(); }, 60); }
function closeModal(){ if (S.busy) return; $('#modal').classList.remove('open'); }
function confirmBox(title, text, okLabel, onOk){
  modal('<h2>' + esc(title) + '</h2><p class="muted">' + esc(text) + '</p><div class="row end"><button class="btn ghost" onclick="closeModal()">Go back</button><button class="btn primary" id="cfOk">' + esc(okLabel) + '</button></div>');
  $('#cfOk').onclick = () => { closeModal(); onOk(); };
}
function busy(btn, on, label){
  if (!btn) return;
  if (on){ btn.dataset.l = btn.innerHTML; btn.disabled = true; btn.innerHTML = '<span class="spin"></span> ' + (label || 'Saving…'); }
  else { btn.disabled = false; if (btn.dataset.l) btn.innerHTML = btn.dataset.l; }
}
function skeleton(){ return '<div class="card"><div class="sk" style="height:28px;width:40%"></div><div class="sk" style="height:16px;width:65%;margin-top:12px"></div><div class="sk" style="height:70px;margin-top:18px"></div></div>'; }
function typeTag(t, extra){ const x = TYPES[t]; return '<span class="tag" style="--c:' + (x ? x.c : 'var(--grape)') + '">' + esc(x ? x.label : t) + (extra != null ? ' ' + esc(extra) : '') + '</span>'; }
function itemById(id){ return (S.stock && S.stock.items || []).find(i => i.id === id); }

/* ================= LOAD / REFRESH TIMER (header) ================= */
/* Every server load goes through tracked(): the header shows a live "Loading… x s" while it runs,
   then "Loaded in x s" and the time of the last refresh. */
async function tracked(fn){
  if (!S.pending){ S.load.start = performance.now(); S.load.failed = false; }
  S.pending++; updateLoadInfo();
  try { return await fn(); }
  catch (e) { S.load.failed = true; throw e; }
  finally {
    S.pending--;
    if (!S.pending && !S.load.failed){ S.load.ms = performance.now() - S.load.start; S.load.at = new Date(); }
    updateLoadInfo();
  }
}
function stampNow(ms){ S.load.ms = ms; S.load.at = new Date(); S.load.failed = false; updateLoadInfo(); }
function secs(ms){ return (ms / 1000).toFixed(1) + ' s'; }
function agoText(d){
  const s = Math.max(0, Math.floor((Date.now() - d.getTime()) / 1000));
  if (s < 60) return s + ' s ago';
  if (s < 3600) return Math.floor(s / 60) + ' min ago';
  return Math.floor(s / 3600) + ' h ago';
}
function updateLoadInfo(){
  const L = S.load, lab = $('#liLab'), val = $('#liVal'), sub = $('#liSub'), spin = $('#liSpin');
  if (!lab) return;
  spin.style.display = S.pending ? '' : 'none';
  lab.className = '';
  if (S.pending){ lab.textContent = 'Loading…'; val.textContent = secs(performance.now() - L.start); }
  else if (L.failed){ lab.textContent = 'Refresh failed'; lab.className = 'bad'; val.textContent = ''; }
  else if (L.ms != null){ lab.textContent = 'Loaded in'; val.textContent = secs(L.ms); }
  else { lab.textContent = 'Starting…'; val.textContent = ''; }
  sub.textContent = L.at
    ? 'Refreshed ' + L.at.toLocaleTimeString('en-IN', { hour: 'numeric', minute: '2-digit', second: '2-digit', hour12: true }) + ' · ' + agoText(L.at)
    : 'Not refreshed yet';
}

/* Cart preview: same sequential calculation as the server */
function previewCart(){
  const run = {};
  return S.cart.map(l => {
    const it = itemById(l.itemId);
    const before = run[l.itemId] !== undefined ? run[l.itemId] : (it ? it.closing : 0);
    const signed = TYPES[l.type].sign * l.qty;
    const after = before + signed;
    let error = '';
    if (!it) error = 'Item is not in the list, refresh the app';
    else if (after < 0) error = 'Stock is only ' + before;
    run[l.itemId] = after;
    return { line: l, before, signed, after, error };
  });
}
function pendingFor(id){ const pv = previewCart().filter(p => p.line.itemId === id); return pv.length ? pv[pv.length - 1].after : null; }

/* ================= BOOT ================= */
window.addEventListener('load', boot);
async function boot(){
  bindUI(); tick(); setInterval(tick, 1000);
  try {
    await tracked(async () => {
      S.init = await call('getInitData');
      $('#bootBox').remove();
      renderStaff(true); renderBanners();
      S.f = { from: S.init.monthStart, to: S.init.today, sec: 'All' };
      renderFilters();
      const saved = store('foh_section');
      setSection(saved === 'Barista' ? 'Barista' : 'Cafe', true);
      showView('stock');
      await fetchStock();
    });
    setInterval(() => {
      if (S.view === 'stock' && !$('#modal').classList.contains('open') && !S.busy && !S.refreshing && !document.hidden && !S.open) loadStock(true);
    }, 60000);
    document.addEventListener('visibilitychange', () => { if (!document.hidden && S.view === 'stock' && !S.open && !S.refreshing) loadStock(true); });
  } catch (e) {
    const box = $('#bootBox') || $('#banners');
    box.innerHTML = '<div class="card" style="max-width:520px"><h3>The app could not load</h3><p class="muted">' + esc(errMsg(e)) + '</p><button class="btn primary" onclick="location.reload()">Try again</button></div>';
  }
}
function bindUI(){
  $$('.tab').forEach(t => t.onclick = () => showView(t.dataset.view));
  $$('#secSeg button').forEach(b => b.onclick = () => setSection(b.dataset.sec));
  $('#q').addEventListener('input', e => { S.q = e.target.value; renderStock(); });
  $('#btnHdrRefresh').onclick = refreshAll;
  $('#staffSel').onchange = e => { S.staff = e.target.value; store('foh_staff', S.staff); markStaff(); };
  $('#ciBtn').onclick = () => openCart();
  $('#ciClear').onclick = () => confirmBox('Clear the list?', S.cart.length + ' unsaved ' + (S.cart.length === 1 ? 'entry' : 'entries') + ' will be removed.', 'Yes, clear', () => { S.cart = []; S.reqId = null; renderStock(); updateBar(); });
  $('#modal').addEventListener('click', e => { if (e.target.id === 'modal' && !S.modalLock) closeModal(); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && !S.modalLock) closeModal(); });
}
function tick(){
  $('#clock').textContent = new Date().toLocaleTimeString('en-IN', { hour: 'numeric', minute: '2-digit', hour12: true });
  updateLoadInfo();
}
function renderStaff(first){
  const sel = $('#staffSel'), list = (S.init && S.init.staff) || [];
  const want = first ? store('foh_staff') : S.staff;
  sel.innerHTML = '<option value="">Select</option>' + list.map(n => '<option' + (n === want ? ' selected' : '') + '>' + esc(n) + '</option>').join('');
  S.staff = list.indexOf(want) >= 0 ? want : '';
  markStaff();
}
function markStaff(){ $('#staffWrap').classList.toggle('need', !S.staff); }
function renderBanners(){
  const i = S.init || {}, b = [];
  if (!(i.staff || []).length) b.push('<div class="banner err">There is no active name in the STAFF tab. Add a name first, otherwise entries cannot be saved.</div>');
  if (i.noSectionCount) b.push('<div class="banner">' + i.noSectionCount + ' item(s) have no Section in ITEM_MASTER, so they are not shown in the app.</div>');
  if (i.defaultPin) b.push('<div class="banner">The Manager PIN is still the default (1234). Change it in the SETTINGS tab.</div>');
  (i.warnings || []).slice(0, 5).forEach(w => b.push('<div class="banner">' + esc(w) + '</div>'));
  $('#banners').innerHTML = b.join('');
}
function showView(v){
  S.view = v;
  $$('.tab').forEach(t => t.classList.toggle('active', t.dataset.view === v));
  $$('.view').forEach(x => x.classList.toggle('active', x.id === 'v-' + v));
  updateBar();
  if ((v === 'sum' || v === 'ent') && !S.sum) loadSummary();
  if (v === 'sum') renderSummary();
  if (v === 'ent') renderEntries();
  window.scrollTo(0, 0);
}

/* ================= FULL REFRESH (header button) ================= */
/* Reloads everything: staff list, warnings, stock of the current section and the summary.
   An unsaved list is kept, and re-checked against the fresh stock. */
async function refreshAll(){
  if (S.refreshing) return;
  S.refreshing = true;
  const btn = $('#btnHdrRefresh'); btn.disabled = true; btn.classList.add('spinning');
  const t0 = performance.now();
  try {
    await tracked(async () => {
      const prevToday = S.init && S.init.today;
      S.init = await call('getInitData');
      renderStaff(false); renderBanners();
      if (S.f){
        if (S.f.to === prevToday) S.f.to = S.init.today;
        $$('#sumFilters input[type=date], #entFilters input[type=date]').forEach(i => { i.max = S.init.today; });
        syncFilters('');
      }
      const jobs = [fetchStock()];
      if (S.sum || S.view === 'sum' || S.view === 'ent') jobs.push(fetchSummary());
      await Promise.all(jobs);
    });
    toast('Everything refreshed in ' + secs(performance.now() - t0), 'ok');
  } catch (e) {
    toast('Refresh failed: ' + errMsg(e), 'err');
  } finally {
    S.refreshing = false; btn.disabled = false; btn.classList.remove('spinning');
  }
}

/* ================= SECTION ================= */
function setSection(sec, silent){
  if (sec === S.section && !silent) return;
  if (S.cart.length && !silent){
    confirmBox('Switch to ' + sec + '?', 'You have ' + S.cart.length + ' unsaved ' + S.section + ' ' + (S.cart.length === 1 ? 'entry' : 'entries') + ' in the list. Switching will remove them.', 'Clear and switch', () => {
      S.cart = []; S.reqId = null; setSection(sec, true); S.stock = null; renderStock(); loadStock();
    });
    return;
  }
  S.section = sec; S.cat = 'All'; S.open = null; store('foh_section', sec);
  $$('#secSeg button').forEach(b => b.classList.toggle('on', b.dataset.sec === sec));
  if (!silent){ S.stock = null; renderStock(); loadStock(); }
  updateBar();
}

/* ================= STOCK ================= */
function fetchStock(){
  const sec = S.section;
  return tracked(async () => {
    const st = await call('getStock', sec);
    if (sec !== S.section) return null;
    S.stock = st;
    if (S.init && st.date !== S.init.today) S.init.today = st.date;
    renderStock();
    return st;
  });
}
async function loadStock(silent){
  if (!silent && !S.stock) $('#stockList').innerHTML = skeleton();
  try { await fetchStock(); }
  catch (e) { if (!silent) $('#stockList').innerHTML = '<div class="card empty">' + esc(errMsg(e)) + '</div>'; }
}
function renderStock(){
  if (!S.stock){ $('#stockMeta').textContent = ''; $('#chips').innerHTML = ''; return; }
  const items = S.stock.items;
  const cats = [...new Set(items.map(i => i.category))];
  if (S.cat !== 'All' && cats.indexOf(S.cat) < 0) S.cat = 'All';
  const cnt = c => items.filter(i => c === 'All' || i.category === c).length;
  $('#chips').innerHTML = ['All'].concat(cats).map(c => '<button type="button" class="chip' + (c === S.cat ? ' on' : '') + '" data-cat="' + esc(c) + '">' + esc(c) + ' <b>' + cnt(c) + '</b></button>').join('');
  $$('#chips .chip').forEach(b => b.onclick = () => { S.cat = b.dataset.cat; renderStock(); });
  const outCount = items.filter(i => i.closing <= 0).length;
  $('#stockMeta').innerHTML = esc(S.section) + ': ' + items.length + ' items · ' + fmtDate(S.stock.date) +
    (outCount ? ' · <span style="color:var(--red)">' + outCount + ' out of stock</span>' : '');

  const q = S.q.trim().toLowerCase();
  const list = items.filter(i => (S.cat === 'All' || i.category === S.cat) && (!q || i.name.toLowerCase().includes(q)));
  if (!items.length){ $('#stockList').innerHTML = '<div class="card empty">There are no items in ' + esc(S.section) + ' yet. Set the Section of items to "' + esc(S.section) + '" in ITEM_MASTER.</div>'; return; }
  if (!list.length){ $('#stockList').innerHTML = '<div class="card empty">No item matches "' + esc(S.q) + '".</div>'; return; }

  const groups = {};
  list.forEach(i => { (groups[i.category] = groups[i.category] || []).push(i); });
  $('#stockList').innerHTML = Object.keys(groups).map(cat =>
    '<div class="card"><div class="sec-head"><h3>' + esc(cat) + '</h3><span class="pill">' + groups[cat].length + ' items</span></div>' +
    groups[cat].map(itemHtml).join('') + '</div>').join('');
  $$('#stockList .item').forEach(el => el.onclick = () => toggleItem(el.dataset.id));
  if (S.open) bindOpts();
}
function itemHtml(i){
  const on = S.open === i.id, pend = pendingFor(i.id);
  const meta = ['<span>Opening ' + i.opening + '</span>',
    i.added ? '<span class="p">Added ' + i.added + '</span>' : '',
    i.breakage ? '<span class="m">Breakage ' + i.breakage + '</span>' : '',
    i.missing ? '<span class="m">Missing ' + i.missing + '</span>' : '',
    i.adjust ? '<span>Adjust ' + sgn(i.adjust) + '</span>' : ''].join('');
  return '<div class="item-wrap' + (on ? ' on' : '') + (i.closing <= 0 ? ' out' : '') + '">' +
    '<div class="item" data-id="' + esc(i.id) + '">' +
      '<div style="flex:1"><div class="item-name">' + esc(i.name) +
        (pend !== null ? ' <span class="pill pend">After save: ' + pend + '</span>' : '') +
        (i.closing <= 0 ? ' <span class="pill bad">Out of stock</span>' : '') + '</div>' +
      '<div class="item-meta num">' + meta + '</div></div>' +
      '<div class="stock num"><b>' + i.closing + '</b><span>now</span></div>' +
    '</div>' + (on ? optsHtml(i) : '') + '</div>';
}
function toggleItem(id){
  if (S.open === id){ S.open = null; }
  else { S.open = id; S.ed = { type: 'BREAKAGE', qty: 1, remark: '' }; }
  renderStock();
}
function optsHtml(i){
  const e = S.ed;
  return '<div class="item-opts">' +
    '<div class="types">' + Object.keys(TYPES).map(t => '<button type="button" class="type' + (e.type === t ? ' on' : '') + '" style="--c:' + TYPES[t].c + '" data-t="' + t + '">' +
      '<span>' + TYPES[t].label + '</span><small>' + TYPES[t].hint + '</small></button>').join('') + '</div>' +
    '<div class="opt-grid">' +
      '<label><span id="qLab">' + 'Quantity' + '</span><div class="stepper"><button type="button" id="qMinus" aria-label="Decrease">−</button>' +
        '<input id="eQty" inputmode="numeric" value="' + e.qty + '"><button type="button" id="qPlus" aria-label="Increase">+</button></div></label>' +
      '<label>Remark (optional)<input id="eRem" maxlength="300" placeholder="e.g. broken during a party" value="' + esc(e.remark) + '"></label>' +
    '</div>' +
    '<div class="row" style="justify-content:space-between;margin-top:6px"><div class="preview num" id="ePrev"></div>' +
    '<div class="row"><button type="button" class="btn ghost" id="eCancel">Cancel</button><button type="button" class="btn primary" id="eAdd">Add to list</button></div></div>' +
  '</div>';
}
function bindOpts(){
  const id = S.open;
  $$('.item-opts .type').forEach(b => b.onclick = () => {
    S.ed.type = b.dataset.t;
    if (!S.ed.qty) S.ed.qty = 1;
    renderStock();
  });
  const qty = $('#eQty');
  qty.oninput = () => { qty.value = qty.value.replace(/\D/g, ''); S.ed.qty = qty.value === '' ? '' : Number(qty.value); edPreview(); };
  $('#qMinus').onclick = () => { S.ed.qty = Math.max(0, (Number(S.ed.qty) || 0) - 1); qty.value = S.ed.qty; edPreview(); };
  $('#qPlus').onclick = () => { S.ed.qty = Math.min(10000, (Number(S.ed.qty) || 0) + 1); qty.value = S.ed.qty; edPreview(); };
  $('#eRem').oninput = e => { S.ed.remark = e.target.value; };
  $('#eCancel').onclick = () => { S.open = null; renderStock(); };
  $('#eAdd').onclick = addToCart;
  edPreview();
}
function edBase(id){ const p = pendingFor(id); const it = itemById(id); return p !== null ? p : (it ? it.closing : 0); }
function edPreview(){
  const id = S.open, e = S.ed, base = edBase(id), n = Number(e.qty);
  let txt, bad = false;
  if (e.qty === '' || !Number.isInteger(n) || n < 0 || n > 10000){ txt = 'Enter a whole number (0 to 10000)'; bad = true; }
  else if (n === 0){ txt = 'Quantity cannot be 0'; bad = true; }
  else {
    const after = base + TYPES[e.type].sign * n;
    if (after < 0){ txt = TYPES[e.type].label + ' ' + n + ' is not possible, stock is only ' + base; bad = true; }
    else txt = 'Stock ' + base + ' → ' + after;
  }
  $('#ePrev').textContent = txt; $('#ePrev').classList.toggle('bad', bad); $('#eAdd').disabled = bad;
}
function addToCart(){
  const it = itemById(S.open); if (!it) return;
  S.cart.push({ key: uuid(), itemId: it.id, name: it.name, type: S.ed.type, qty: Number(S.ed.qty), remark: String(S.ed.remark || '').trim() });
  S.reqId = null; S.open = null;
  renderStock(); updateBar();
  toast(it.name + ' added to the list');
}

/* ================= SAVE BAR + REVIEW ================= */
function updateBar(){
  const n = S.cart.length;
  $('#ciBar').classList.toggle('show', S.view === 'stock' && n > 0);
  const by = {};
  S.cart.forEach(l => { by[l.type] = (by[l.type] || 0) + 1; });
  $('#ciSum').innerHTML = esc(S.section) + ': ' + n + (n === 1 ? ' entry' : ' entries') + ' to save<small>' +
    Object.keys(by).map(t => by[t] + ' × ' + TYPES[t].label).join(', ') + '</small>';
}
function openCart(err){
  if (!S.cart.length) return;
  const pv = previewCart(), anyErr = pv.some(p => p.error);
  modal('<h2>Check before saving</h2>' +
    '<p class="muted">' + esc(S.section) + ' section, ' + fmtDate(S.init.today) + (S.staff ? ', entry by <b>' + esc(S.staff) + '</b>' : '') + '</p>' +
    pv.map(p => '<div class="line"><div><div class="t1">' + esc(p.line.name) + '</div>' +
      '<div class="t2 num">' + typeTag(p.line.type, p.line.qty) + ' &nbsp;Stock ' + p.before + ' → <b>' + p.after + '</b>' +
      (p.line.remark ? ', ' + esc(p.line.remark) : '') + '</div>' +
      (p.error ? '<div class="err">' + esc(p.error) + '</div>' : '') + '</div>' +
      '<button type="button" class="btn ghost sm rm" data-key="' + p.line.key + '">Remove</button></div>').join('') +
    '<div class="fgrid">' +
      (S.staff ? '' : '<label class="full">Who is making this entry? *<select id="cBy"><option value="">Select</option>' + (S.init.staff || []).map(n => '<option>' + esc(n) + '</option>').join('') + '</select></label>') +
    '</div>' +
    '<div class="err" id="cErr">' + esc(err || '') + '</div>' +
    '<div class="row end"><button class="btn ghost" id="cClose">Back</button><button class="btn go big" id="cSave"' + (anyErr ? ' disabled' : '') + '>Save ' + S.cart.length + (S.cart.length === 1 ? ' entry' : ' entries') + '</button></div>');
  $$('#modalBody .rm').forEach(b => b.onclick = () => {
    S.cart = S.cart.filter(l => l.key !== b.dataset.key); S.reqId = null;
    renderStock(); updateBar();
    if (S.cart.length) openCart(); else closeModal();
  });
  $('#cClose').onclick = closeModal;
  $('#cSave').onclick = saveCart;
}
async function saveCart(){
  if (S.busy) return;
  const bySel = $('#cBy');
  if (bySel){
    if (!bySel.value){ $('#cErr').textContent = 'Select your name.'; return; }
    S.staff = bySel.value; $('#staffSel').value = S.staff; store('foh_staff', S.staff); markStaff();
  }
  if (!S.reqId) S.reqId = uuid();
  const n = S.cart.length;
  const payload = { requestId: S.reqId, section: S.section, enteredBy: S.staff,
                    lines: S.cart.map(l => ({ itemId: l.itemId, type: l.type, qty: l.qty, remark: l.remark })) };
  busy($('#cSave'), true); S.busy = true; S.modalLock = true; $('#cErr').textContent = '';
  const t0 = performance.now();
  try {
    const res = await call('saveEntries', payload);
    S.busy = false; S.modalLock = false;
    S.cart = []; S.reqId = null;
    if (res.stock && res.stock.section === S.section) S.stock = res.stock;
    closeModal(); renderStock(); updateBar();
    S.sum = null;                                   // the summary is fetched fresh next time
    stampNow(performance.now() - t0);
    toast(res.duplicate ? 'These entries were already saved' : n + (n === 1 ? ' entry saved' : ' entries saved'), 'ok');
  } catch (e) {
    S.busy = false; S.modalLock = false;
    await loadStock(true);                          // re-check the list against the latest stock
    openCart(errMsg(e));
  }
}

/* ================= SUMMARY + ENTRIES ================= */
function renderFilters(){
  const html = (id) =>
    '<label>From<input type="date" id="' + id + 'From" value="' + esc(S.f.from) + '" max="' + esc(S.init.today) + '"></label>' +
    '<label>To<input type="date" id="' + id + 'To" value="' + esc(S.f.to) + '" max="' + esc(S.init.today) + '"></label>' +
    '<div><span class="small muted" style="font-weight:700;display:block;margin-bottom:5px">Section</span><div class="seg sm" data-f="' + id + '">' +
      ['All', 'Cafe', 'Barista'].map(s => '<button type="button" data-s="' + s + '" class="' + (S.f.sec === s ? 'on' : '') + '">' + s + '</button>').join('') + '</div></div>' +
    '<div class="spacer"></div><button class="btn primary" data-go="' + id + '">Show</button>';
  $('#sumFilters').innerHTML = html('sf');
  $('#entFilters').innerHTML = html('ef');
  ['sf', 'ef'].forEach(id => {
    $$('[data-f="' + id + '"] button').forEach(b => b.onclick = () => { S.f.sec = b.dataset.s; syncFilters(id); loadSummary(); });
    $('[data-go="' + id + '"]').onclick = () => { S.f.from = $('#' + id + 'From').value; S.f.to = $('#' + id + 'To').value; syncFilters(id); loadSummary(); };
  });
}
function syncFilters(fromId){
  ['sf', 'ef'].forEach(id => {
    if (id !== fromId){ const a = $('#' + id + 'From'), b = $('#' + id + 'To'); if (a) a.value = S.f.from; if (b) b.value = S.f.to; }
    $$('[data-f="' + id + '"] button').forEach(b => b.classList.toggle('on', b.dataset.s === S.f.sec));
  });
}
function fetchSummary(){
  return tracked(async () => {
    S.sum = await call('getSummary', { from: S.f.from, to: S.f.to, section: S.f.sec });
    renderSummary(); renderEntries();
    return S.sum;
  });
}
async function loadSummary(){
  if (!S.f.from || !S.f.to){ toast('Choose both the From and To dates', 'err'); return; }
  $('#sumOut').innerHTML = skeleton(); $('#entOut').innerHTML = skeleton();
  try { await fetchSummary(); }
  catch (e) {
    const m = '<div class="card empty">' + esc(errMsg(e)) + '</div>';
    $('#sumOut').innerHTML = m; $('#entOut').innerHTML = m;
  }
}
function renderSummary(){
  const s = S.sum; if (!s) return;
  const t = s.totals;
  const k = (n, l, col) => '<div class="kpi"><b class="num"' + (col ? ' style="color:' + col + '"' : '') + '>' + n + '</b><span>' + l + '</span></div>';
  // breakage + missing by category
  const byCat = {};
  s.rows.forEach(r => { const o = r.breakage + r.missing; if (o) byCat[r.category] = (byCat[r.category] || 0) + o; });
  const cats = Object.keys(byCat).sort((a, b) => byCat[b] - byCat[a]);
  const max = cats.length ? Math.max.apply(null, cats.map(c => byCat[c])) : 0;
  const bars = cats.length ? '<div class="bars">' + cats.map(c => '<div class="bar"><span>' + esc(c) + '</span><div class="track"><div class="fill" style="width:' + Math.round(byCat[c] / max * 100) + '%"></div></div><b class="num">' + byCat[c] + '</b></div>').join('') + '</div>'
    : '<div class="empty">Nothing was broken or lost in this range 🎉</div>';
  // most affected items
  const top = s.rows.filter(r => r.breakage + r.missing > 0).sort((a, b) => (b.breakage + b.missing) - (a.breakage + a.missing)).slice(0, 6);
  const cards = top.length ? '<div class="band-grid">' + top.map(r => {
    const out = r.breakage + r.missing, base = r.opening + r.added, pct = base ? Math.min(100, Math.round(out / base * 100)) : 0;
    return '<div class="band-card"><div class="bc-top">' + esc(r.name) + '<small>' + esc(r.category) + (s.section === 'All' ? ', ' + esc(r.section) : '') + '</small></div>' +
      '<div class="bc-num"><b>' + out + '</b><span>lost, out of ' + base + '</span></div><div class="bc-bar"><i style="width:' + pct + '%"></i></div>' +
      '<div class="small muted" style="font-weight:700;margin-top:6px">Breakage ' + r.breakage + ', Missing ' + r.missing + ', now ' + r.closing + '</div></div>';
  }).join('') + '</div>' : '<div class="empty">No breakage or missing items</div>';

  $('#sumOut').innerHTML =
    '<p class="muted small" style="margin:0 0 10px 4px">' + fmtDate(s.from) + ' to ' + fmtDate(s.to) + ', ' + (s.section === 'All' ? 'Cafe + Barista' : esc(s.section)) + '</p>' +
    '<div class="kpis">' + k(t.opening, 'Opening') + k(t.added, 'Added', 'var(--grass)') + k(t.breakage, 'Breakage', 'var(--red)') +
      k(t.missing, 'Missing', 'var(--amber)') + (t.adjust ? k(sgn(t.adjust), 'Adjust') : '') + k(t.closing, 'Closing') + '</div>' +
    '<div class="two"><div class="card"><h3>Breakage &amp; missing by category</h3>' + bars + '</div>' +
      '<div class="card"><h3>Most affected items</h3>' + cards + '</div></div>' +
    '<div class="card"><div class="sec-head"><h3>Item-wise</h3><div class="row">' +
      '<label class="check"><input type="checkbox" id="onlyMoved"' + (S.onlyMoved ? ' checked' : '') + '> Only items with activity</label>' +
      '<input id="sumQ" placeholder="Search items" style="max-width:220px" value="' + esc(S.sumQ) + '"></div></div><div id="sumTable"></div></div>';
  $('#onlyMoved').onchange = e => { S.onlyMoved = e.target.checked; renderSumTable(); };
  $('#sumQ').oninput = e => { S.sumQ = e.target.value; renderSumTable(); };
  renderSumTable();
}
function renderSumTable(){
  const s = S.sum, el = $('#sumTable'); if (!s || !el) return;
  const q = S.sumQ.trim().toLowerCase();
  const rows = s.rows.filter(r => (!S.onlyMoved || r.added || r.breakage || r.missing || r.adjust) && (!q || r.name.toLowerCase().includes(q)));
  if (!rows.length){ el.innerHTML = '<div class="empty">No items to show</div>'; return; }
  const adj = s.rows.some(r => r.adjust);          // old Adjust entries (if any) stay visible so the numbers add up
  const sum = rows.reduce((a, r) => { ['opening', 'added', 'breakage', 'missing', 'adjust', 'closing'].forEach(k => a[k] += r[k]); return a; },
    { opening: 0, added: 0, breakage: 0, missing: 0, adjust: 0, closing: 0 });
  el.innerHTML = '<div class="tbl-wrap"><table class="tbl"><thead><tr><th>Item</th><th>Category</th>' + (s.section === 'All' ? '<th>Section</th>' : '') +
    '<th class="n">Opening</th><th class="n">Added</th><th class="n">Breakage</th><th class="n">Missing</th>' + (adj ? '<th class="n">Adjust</th>' : '') + '<th class="n">Closing</th></tr></thead><tbody>' +
    rows.map(r => '<tr><td><b>' + esc(r.name) + '</b></td><td>' + esc(r.category) + '</td>' + (s.section === 'All' ? '<td>' + esc(r.section) + '</td>' : '') +
      '<td class="n">' + r.opening + '</td><td class="n' + (r.added ? ' a' : '') + '">' + r.added + '</td><td class="n' + (r.breakage ? ' b' : '') + '">' + r.breakage + '</td>' +
      '<td class="n' + (r.missing ? ' b' : '') + '">' + r.missing + '</td>' + (adj ? '<td class="n">' + sgn(r.adjust) + '</td>' : '') + '<td class="n"><b>' + r.closing + '</b></td></tr>').join('') +
    '<tr class="total"><td>Total</td><td></td>' + (s.section === 'All' ? '<td></td>' : '') + ['opening', 'added', 'breakage', 'missing'].map(k => '<td class="n">' + sum[k] + '</td>').join('') +
    (adj ? '<td class="n">' + sgn(sum.adjust) + '</td>' : '') + '<td class="n">' + sum.closing + '</td></tr></tbody></table></div>';
}
function renderEntries(){
  const s = S.sum; if (!s) return;
  const active = s.entries.filter(e => e.status === 'ACTIVE');
  const cnt = t => active.filter(e => e.type === t).length;
  $('#entOut').innerHTML =
    '<div class="kpis">' + Object.keys(TYPES).map(t => '<div class="kpi"><b class="num" style="color:' + TYPES[t].c + '">' + cnt(t) + '</b><span>' + TYPES[t].label + ' entries</span></div>').join('') +
      '<div class="kpi"><b class="num">' + (s.entries.length - active.length) + '</b><span>Voided</span></div></div>' +
    '<div class="card"><div class="sec-head"><h3>Entries (' + s.entriesTotal + ')</h3><input id="entQ" placeholder="Item, name or Txn ID" style="max-width:260px" value="' + esc(S.entQ) + '"></div><div id="entTable"></div>' +
    (s.entriesTotal > s.entries.length ? '<p class="muted small">Only the latest ' + s.entries.length + ' entries are shown. Narrow the date range.</p>' : '') + '</div>';
  $('#entQ').oninput = e => { S.entQ = e.target.value; renderEntTable(); };
  renderEntTable();
}
function renderEntTable(){
  const s = S.sum, el = $('#entTable'); if (!s || !el) return;
  const q = S.entQ.trim().toLowerCase();
  const list = s.entries.filter(e => !q || (e.itemName + ' ' + e.by + ' ' + e.txnId + ' ' + e.remark).toLowerCase().includes(q));
  el.innerHTML = list.length ? '<div class="tbl-wrap"><table class="tbl"><thead><tr><th>Date</th><th>Time</th><th>Item</th><th>Section</th><th>Type</th><th class="n">Qty</th><th>By</th><th>Remark</th><th>Txn</th><th></th></tr></thead><tbody>' +
    list.map(e => '<tr class="' + (e.status === 'VOID' ? 'void' : '') + '"><td>' + fmtDate(e.date) + '</td><td class="num">' + esc(e.time) + '</td><td><b>' + esc(e.itemName) + '</b></td><td>' + esc(e.section) + '</td>' +
      '<td>' + typeTag(e.type) + '</td><td class="n"><b>' + sgn(e.signed) + '</b></td><td>' + esc(e.by) + '</td><td>' + esc(e.remark) + (e.status === 'VOID' ? '<br><span class="pill bad">VOID: ' + esc(e.voidReason) + '</span>' : '') + '</td>' +
      '<td class="small muted">' + esc(e.txnId) + '</td><td>' + (e.status === 'ACTIVE' ? '<button class="btn danger sm" data-void="' + esc(e.txnId) + '">Void</button>' : '') + '</td></tr>').join('') +
    '</tbody></table></div>' : '<div class="empty">No entries</div>';
  $$('#entTable [data-void]').forEach(b => b.onclick = () => openVoid(b.dataset.void));
}
function openVoid(txnId){
  const e = S.sum.entries.find(x => x.txnId === txnId); if (!e) return;
  modal('<h2>Void this entry</h2>' +
    '<p class="muted">' + esc(e.itemName) + ', ' + typeTag(e.type, sgn(e.signed)) + ', ' + fmtDate(e.date) + ' ' + esc(e.time) + ' (' + esc(txnId) + ')</p>' +
    '<p class="muted small">Voiding removes this entry from the stock calculation. The record stays in the sheet.</p>' +
    '<div class="fgrid"><label class="full">Reason *<input id="vReason" maxlength="300" placeholder="e.g. wrong item selected" autofocus></label>' +
    '<label>Who is voiding this? *<select id="vBy"><option value="">Select</option>' + (S.init.staff || []).map(n => '<option' + (n === S.staff ? ' selected' : '') + '>' + esc(n) + '</option>').join('') + '</select></label>' +
    '<label>Manager PIN *<input id="vPin" type="password" inputmode="numeric" autocomplete="off"></label></div>' +
    '<div class="err" id="vErr"></div>' +
    '<div class="row end"><button class="btn ghost" onclick="closeModal()">Cancel</button><button class="btn danger" id="vGo">Void</button></div>');
  $('#vGo').onclick = async () => {
    if (S.busy) return;
    const reason = $('#vReason').value.trim(), by = $('#vBy').value, pin = $('#vPin').value.trim();
    if (reason.length < 3){ $('#vErr').textContent = 'Enter a reason.'; return; }
    if (!by){ $('#vErr').textContent = 'Select a name.'; return; }
    if (!pin){ $('#vErr').textContent = 'Enter the PIN.'; return; }
    busy($('#vGo'), true, 'Voiding…'); S.busy = true; S.modalLock = true;
    try {
      await call('voidEntry', { txnId, reason, enteredBy: by, pin });
      S.busy = false; S.modalLock = false; closeModal();
      toast(txnId + ' voided', 'ok');
      loadSummary(); loadStock(true);
    } catch (err) {
      S.busy = false; S.modalLock = false; busy($('#vGo'), false); $('#vErr').textContent = errMsg(err);
    }
  };
}
</script>
